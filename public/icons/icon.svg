<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- AidSudoku mark: a 3×3 grid of quiet logic with one cell lit — the A-ha moment.
       The lit cell sits middle-right on purpose (a discovery inside a system, not a logo),
       and its glow bleeds past the grid lines because one insight resolves a row, a column
       and a box at once. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E222C"/><stop offset="1" stop-color="#0C0E13"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F5B83D" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#F5B83D" stop-opacity=".28"/>
      <stop offset="1" stop-color="#F5B83D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD277"/><stop offset="1" stop-color="#F0A92A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="1" y="1" width="510" height="510" rx="115" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
  <circle cx="362" cy="256" r="150" fill="url(#glow)"/>
  <g stroke="rgba(255,255,255,.34)" stroke-width="6" stroke-linecap="round">
    <line x1="202.7" y1="96" x2="202.7" y2="416"/><line x1="309.3" y1="96" x2="309.3" y2="416"/>
    <line x1="96" y1="202.7" x2="416" y2="202.7"/><line x1="96" y1="309.3" x2="416" y2="309.3"/>
  </g>
  <rect x="96" y="96" width="320" height="320" rx="22" fill="none" stroke="rgba(255,255,255,.62)" stroke-width="9"/>
  <g fill="rgba(255,255,255,.38)">
    <circle cx="149" cy="149" r="10"/><circle cx="256" cy="149" r="10"/><circle cx="362" cy="149" r="10"/>
    <circle cx="149" cy="256" r="10"/><circle cx="256" cy="256" r="10"/>
    <circle cx="149" cy="362" r="10"/><circle cx="256" cy="362" r="10"/><circle cx="362" cy="362" r="10"/>
  </g>
  <rect x="320" y="214" width="84" height="84" rx="18" fill="url(#cell)"/>
  <rect x="320" y="214" width="84" height="84" rx="18" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
</svg>
